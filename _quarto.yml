description-meta: "Dr. Sudipto Banerjee is a Professor in the Department of Biostatistics at UCLA. He is a renowned statistician with expertise in Bayesian modeling and inference for complex systems involving massive datasets, spatial statistics, and studies environmental processes and their impact on public health. Key words: Bayesian statistics, spatial statistics, big data, mechanistic systems"
